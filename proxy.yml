services:
  site:
    build: ./site
    restart: unless-stopped
    environment:
    - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
    - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
    volumes:
      - ./site/content:/content:ro
  rep-gen:
    build: ./rep-gen
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - seafile
    networks:
      - default
      - seafile-net


volumes:
  caddy_data:
  seafile_data:
  seafile_db: